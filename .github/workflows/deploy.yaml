name: Deploy Node.js API to AWS EC2

on:
  push:
    branches:
      - main  # Se ejecuta en cada push a la rama "main"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v3

      - name: 📦 Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📦 Instalar dependencias
        run: npm install

      - name: 🛠 Construir la aplicación (si usas TypeScript)
        run: npm run build

      - name: 📂 Copiar archivos a EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "."
          target: "/home/ubuntu/api"

      - name: 🚀 Ejecutar la API en EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/api
            npm install
            pm2 restart all || pm2 start npm --name "api" -- start
